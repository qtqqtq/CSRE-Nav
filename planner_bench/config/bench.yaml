# Harness parameters: what is true of the benchmark itself, whichever map it is
# run on.  Everything that changes with the map -- arena bounds, the start pose,
# and the targets -- lives in worlds/<world stem>.yaml next to the world file,
# and bench.py picks it up from --world.
robot:
  # Fallback footprint, used only when /robot_description cannot be read.  The
  # live URDF wins, because a collision verdict is a physical claim and has to
  # be made against the robot that is actually in the simulation.
  half_length: 0.145
  half_width: 0.11
  tolerance: 0.02
trial:
  success_radius: 0.30
  success_settle: 0.5
  motion_epsilon: 0.05
  teleport_tolerance: 0.05
  planner_timeout: 120.0
  start_timeout: 8.0
  trial_timeout: 90.0
  stuck_window: 8.0
  progress_epsilon: 0.10
  moving_speed: 0.02
  log_rate: 20.0
trial_checks:
  near_miss_distance: 0.15
