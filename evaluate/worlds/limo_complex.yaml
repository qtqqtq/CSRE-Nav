# Per-world parameters, named after the world they describe and kept beside it:
# worlds/limo_complex.yaml belongs to worlds/limo_complex.world.  bench.py
# derives this path from --world, so a run cannot load one map's geometry with
# another map's targets.
#
# config/bench.yaml holds what is true of the harness rather than of the map:
# the robot footprint, the trial timeouts, the success radius.

arena:
  bounds: [-5.0, 5.0, -5.0, 5.0]
  # Outside the population spawn square; prevents collisions at time zero.
  start: [-3.0, 0.0, 0.0]
  start_clearance: 0.15

# How many trials to run.  Each trial draws a target from `goals` below, so
# this is the number of Gazebo episodes, not the number of targets.  Omit it to
# run each target exactly once.
trials: 10

# How each trial draws its target:
#   cycle  -- walk a fresh random permutation of `goals`, reshuffling whenever it
#             runs out.  Every target gets used the same number of times (to
#             within one), which is what makes the per-target table worth
#             reading; only the order is random.
#   random -- pick uniformly with replacement, the literal reading of "pick one
#             at random".  With few trials this can leave a target unused and
#             another used twice as often, which the per-target table will show.
goal_sample: cycle

# Optional: seed for the target order, so the same list of (trial -> target)
# can be reproduced.  The moving obstacles are re-randomized by Gazebo either
# way, so this fixes the schedule, not the run.
# trial_seed: 0

# The targets to draw from.  Each is {x, y, yaw?} or the [x, y] / [x, y, yaw]
# shorthand; add as many as you want.  The robot is teleported to arena.start
# before every trial, so targets do not chain into a route.
#
# `yaw` is the heading published with the goal.  neupan reads it, cspace ignores
# PoseStamped.orientation entirely, so a non-zero yaw only helps neupan.
# Every point is checked against arena.bounds when the harness starts.
goals:
  - {x: 5.0, y: 0.0, yaw: 0.0}
