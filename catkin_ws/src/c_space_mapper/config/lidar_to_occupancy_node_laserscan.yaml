# lidar_to_occupancy_node — LaserScan mode (2D LiDAR: RPLIDAR / Hokuyo)
sensor_type: laserscan
map_resolution: 0.05
map_width_m: 20.0
map_height_m: 20.0
origin_x: -10.0
origin_y: -10.0
min_range: 0.1
max_range: 20.0
ground_z_min: -0.5
ground_z_max: 2.0
topic_in: /r1/front_laser/scan
topic_out: map_from_gazebo
frame_id: base_link
