# CNN-SAC c-space policy -- older Sparrow generation (36 x 10 rays, 128 features).
#
# Use with: SAC_sparrow_cspace, SAC_sparrow_cspace_{1..4}
# Geometry source: SAC/sparrow_cspace_env.py @ 289333b SPARROW_CSPACE_CFG
# (g_min 0.1, a 0.698 -> nz 10, 3 m, same 1.20 x 0.14 m footprint).  Only the theta
# resolution differs from the current generation; the ray pipeline, the grid
# handedness, the log encoding and the velocity scale are identical.

model_name: SAC_sparrow_cspace_2
device: cuda
stochastic: false            # false = tanh(mean), the deterministic eval policy

# --- c-space geometry (must match training) ---
g_min: 0.1
nz: 10
a: 0.698
cost_ray_max_range: 3.0
cost_ray_num_beams: 36
cost_ray_h_res_degrees: 10.0
footprint: [[0.6, 0.07], [0.6, -0.07], [-0.6, -0.07], [-0.6, 0.07]]

ray_frame: env
preprocess: log

# --- action scaling (same Sparrow continuous_scale) ---
v_linear_max: 0.5
v_angular_max: 2.0
allow_reverse: true
velocity_filter_k: [0.55, 0.60]  # Sparrow K_linear, K_angular

# --- io / frames ---
# Points at the Limo that multi_robot_scenario.launch spawns.  /limo/scan is
# absolute and hardcoded in the Limo's laser plugin, so it keeps that name even
# though /odom and /cmd_vel sit at the root.
# --- io / frames ---
scan_topic: /limo/scan
odom_topic: /odom
cmd_vel_topic: /cmd_vel
goal_topic: /cnav_goal
map_frame: odom
base_frame: base_link
lidar_frame: laser_link
rate: 10.0
goal_tolerance: 0.3
publish_debug: true
